<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF6F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Mon Budget — hors ligne</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: calc(env(safe-area-inset-top) + 32px) 32px
          calc(env(safe-area-inset-bottom) + 32px);
        background: #faf6f1;
        color: #17100b;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: min(200px, 55vw);
        height: auto;
        -webkit-user-drag: none;
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 260px;
        font-size: 14px;
        line-height: 1.6;
        color: #8a7f74;
      }
      button {
        margin-top: 6px;
        padding: 13px 28px;
        border: 0;
        border-radius: 14px;
        background: #b26050;
        color: #fff;
        font-size: 15px;
        font-weight: 620;
        font-family: inherit;
        touch-action: manipulation;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      button:active {
        transform: scale(0.96);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <img src="/logo.svg" alt="Budget Perso" />
    <h1>Pas de connexion</h1>
    <p>
      Tes dépenses sont bien au chaud. Reconnecte-toi à internet pour les
      retrouver.
    </p>
    <button type="button" onclick="location.replace('/')">Réessayer</button>
    <script>
      // Dès que le réseau revient, on repart sur l'app sans rien toucher
      addEventListener('online', function () {
        location.replace('/')
      })
    </script>
  </body>
</html>
